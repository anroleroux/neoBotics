name: cad

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:
    inputs:
      design:
        description: 'a part designation under products/, e.g. PB4/chassis/base_plate, holding description.md, to generate with Claude'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # Tests, every committed part script, and the site: no model, no API key.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # CadQuery's OpenCascade (OCP) and VTK wheels link against these even headless
      - name: Install system libraries for CadQuery
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Install neobotics
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      # every part under products/ (<product>/<assembly>/.../<part>/part.py),
      # then the catalogue pages; a part that fails to build fails the job
      - name: Build the parts and the site
        run: neobotics site products --out results --site site

      - name: Upload the parts
        uses: actions/upload-artifact@v4
        with:
          name: parts
          path: results
          if-no-files-found: error

      - name: Upload the site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # one deployment at a time; let a running one finish
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # NL -> script -> CAD with Claude, on demand: Actions -> cad -> Run workflow,
  # naming a design directory.  Needs the ANTHROPIC_API_KEY repository secret.
  generate:
    if: github.event_name == 'workflow_dispatch' && inputs.design != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system libraries for CadQuery
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Install neobotics
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Generate the part
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DESIGN: ${{ inputs.design }}
        run: |
          neobotics generate --description "products/$DESIGN/description.md" \
            --out "results/$DESIGN"

      - name: Upload the generated part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-part
          path: results
          if-no-files-found: warn
